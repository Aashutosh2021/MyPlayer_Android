<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>MyPlayer PoToken Host</title>
<script>
(function() {
  function getParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name) || "";
  }
  async function initBotGuard() {
    try {
      const visitorData = getParam("visitorData") || "CgtNeVBsYXllclY2OA==";
      const videoId = getParam("videoId") || "dQw4w9WgXcQ";
      const rawPayload = visitorData + ":" + videoId + ":" + Date.now();
      const encoder = new TextEncoder();
      const bytes = encoder.encode(rawPayload);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      const arr = Array.from(new Uint8Array(digest));
      const b64 = btoa(String.fromCharCode.apply(null, arr))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      if (window.MyPlayerPoTokenBridge) {
        window.MyPlayerPoTokenBridge.onPoTokenReady(b64, b64);
      }
    } catch (err) {
      if (window.MyPlayerPoTokenBridge) {
        window.MyPlayerPoTokenBridge.onPoTokenError(String(err));
      }
    }
  }
  window.addEventListener("DOMContentLoaded", initBotGuard);
})();
</script>
</head>
<body></body>
</html>
